[theme]
base = "light"
primaryColor = "#0a84ff"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f7"
textColor = "#1d1d1f"
borderColor = "#e5e5ea"
linkColor = "#0a84ff"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseRadius = "0.6rem"
chartCategoricalColors = ["#0a84ff", "#ff5a36", "#32ade6", "#ff9f0a", "#c7c7cc", "#1d1d1f"]

[browser]
gatherUsageStats = false
